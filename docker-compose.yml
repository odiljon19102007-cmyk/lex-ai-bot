version: '3.8'

services:
  huquq-sphere-bot:
    build: .
    container_name: huquq-sphere-24-7
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./src/data:/app/src/data
